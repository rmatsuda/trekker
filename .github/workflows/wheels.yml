name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheel for cp${{ matrix.python }}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # Windows 64-bit
          - os: windows-latest
            python: 38
            platform_id: win_amd64

          - os: windows-latest
            python: 39
            platform_id: win_amd64

          - os: windows-latest
            python: 310
            platform_id: win_amd64

          - os: windows-latest
            python: 311
            platform_id: win_amd64

          - os: windows-latest
            python: 312
            platform_id: win_amd64


          # Linux 64-bit
          - os: ubuntu-latest
            python: 38
            platform_id: manylinux_x86_64

          - os: ubuntu-latest
            python: 39
            platform_id: manylinux_x86_64

          - os: ubuntu-latest
            python: 310
            platform_id: manylinux_x86_64

          - os: ubuntu-latest
            python: 311
            platform_id: manylinux_x86_64

          - os: ubuntu-latest
            python: 312
            platform_id: manylinux_x86_64


          # macOS Intel
          - os: macos-latest
            python: 38
            arch: x86_64
            platform_id: macosx_x86_64

          - os: macos-latest
            python: 39
            arch: x86_64
            platform_id: macosx_x86_64

          - os: macos-latest
            python: 310
            arch: x86_64
            platform_id: macosx_x86_64

          - os: macos-latest
            python: 311
            arch: x86_64
            platform_id: macosx_x86_64

          - os: macos-latest
            python: 312
            arch: x86_64
            platform_id: macosx_x86_64


          # macOS Apple Silicon
          - os: macos-latest
            python: 38
            arch: arm64
            platform_id: macosx_arm64

          - os: macos-latest
            python: 39
            arch: arm64
            platform_id: macosx_arm64

          - os: macos-latest
            python: 310
            arch: arm64
            platform_id: macosx_arm64

          - os: macos-latest
            python: 311
            arch: arm64
            platform_id: macosx_arm64

          - os: macos-latest
            python: 312
            arch: arm64
            platform_id: macosx_arm64


    steps:

      - uses: actions/checkout@v4
        with:
          submodules: true


      - name: Install Python host for cibuildwheel
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Windows MSVC setup
      - name: Set up MSVC x64
        if: matrix.platform_id == 'win_amd64'
        uses: ilammy/msvc-dev-cmd@v1


      # NASM install (Windows)
      - name: Installing NASM win_amd64
        if: matrix.platform_id == 'win_amd64'
        run: choco install --no-progress -y nasm


      - name: Installing NASM win32
        if: matrix.platform_id == 'win32'
        run: choco install --no-progress -y --x86 nasm


      - name: Add NASM to PATH (win32)
        if: matrix.platform_id == 'win32'
        shell: bash
        run: echo "C:\\Program Files (x86)\\NASM" >> $GITHUB_PATH


      - name: Add NASM to PATH (win_amd64)
        if: matrix.platform_id == 'win_amd64'
        shell: bash
        run: echo "C:\\Program Files\\NASM" >> $GITHUB_PATH


      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.16"


      - name: Build wheels
        env:

          # Linux images
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_I686_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014

          # Target build selector
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}

          # Linux architectures
          CIBW_ARCHS_LINUX: auto aarch64

          # macOS architecture selection
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}

          CIBW_ENVIRONMENT_MACOS: >
            CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

          # Test import after build
          CIBW_TEST_COMMAND: python -c "import Trekker"

          # Allow prerelease Python builds
          CIBW_PRERELEASE_PYTHONS: True

          # Pre-build dependencies
          CIBW_BEFORE_BUILD: pip install cython wheel

        run: python -m cibuildwheel --output-dir wheelhouse src/python/


      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python }}-${{ matrix.platform_id }}
          path: ./wheelhouse/*.whl
